            - paragraph [ref=f67e537]: De skrynkliga äpplena i fruktskålen, två gula lökar och en näve russin kokas långsamt i äppelcidervinäger och farinsocker till en mörk, glansig chutney. Den är söt, syrlig och kryddig på samma gång, med små knäppande senapsfrön och värme från ingefäran. Perfekt på ostbrickan och julbordet, och lika fin att ge bort som att äta själv.
