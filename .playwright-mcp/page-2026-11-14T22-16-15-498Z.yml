        - region "Gör så här" [ref=f64e183]:
          - heading "Gör så här" [level=2] [ref=f64e184]
          - list [ref=f64e185]:
            - listitem [ref=f64e186]: Skär potatisen i tärningar, ca 1 cm. Skalet kan sitta kvar. Finhacka löken.
            - listitem [ref=f64e187]: Skär rödbetorna i lika stora tärningar och lägg dem på hushållspapper så att de torkar. Blöta rödbetor gör potatisen mjuk i stället för krispig.
            - listitem [ref=f64e188]: Hetta upp 2 msk smör och oljan i en stor stekpanna (minst 28 cm) på medelhög värme. Lägg i potatisen i ett jämnt lager och låt den steka orörd i 4–5 minuter innan du vänder. Stek totalt 12–15 minuter tills den är gyllene och krispig. Har du en mindre panna, stek i två omgångar.
            - listitem [ref=f64e189]: Lägg i löken och resten av smöret. Stek 4–5 minuter till löken är mjuk och lätt gyllene.
            - listitem [ref=f64e190]: Vänd ner rödbetorna och timjan och stek 2 minuter till. Smaka av med salt och peppar.
            - listitem [ref=f64e191]: Rör ner rödbetslagen i crème fraichen så att den blir rosa.
            - listitem [ref=f64e192]: Ställ en matring (7–8 cm) på en tallrik, fyll den med pytt och tryck till lätt med en sked. Gör en liten grop i mitten och lyft försiktigt bort ringen. Saknar du ring, pressa pytten i ett glas och stjälp upp den.
            - listitem [ref=f64e193]: Dela äggen och lägg en hel äggula i gropen på varje torn. Den varma pytten värmer gulan lätt.
        - generic [ref=f64e194]:
          - heading "Dekoration och servering" [level=2] [ref=f64e195]
          - list [ref=f64e196]:
            - listitem [ref=f64e197]: Strö krasse och gräslök runt tornet, inte över äggulan, så att den syns.
            - listitem [ref=f64e198]: Lägg en klick rosa crème fraiche bredvid och droppa några prickar rödbetslag på tallriken.
            - listitem [ref=f64e199]: Avsluta med några flingsaltkorn och nymald peppar på äggulan.
            - listitem [ref=f64e200]: Servera på mörka tallrikar så att färgerna lyser.
            - listitem [ref=f64e201]: Vill du undvika rå äggula, toppa tornen med ett stekt ägg med flytande gula i stället.
